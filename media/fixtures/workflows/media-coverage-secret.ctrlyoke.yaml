# Media capture fixture for shot list #9 (media/shots/prompt-editor.capture.ts).
# The prompt editor's ! completion lists secret names that a workflow declares,
# and the capture host's environment sets CODECOV_TOKEN to a dummy value, so the
# take can pick it without writing to this machine's OS credential store.
# Never run; it only needs to exist.
steps:
  - name: Upload coverage
    prompt: Upload the coverage report with !CODECOV_TOKEN.
