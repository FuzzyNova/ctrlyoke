# Script Contexts Test — full compareSource coverage
#
# Exercises all four compareSource options (auto, stdout, stderr, exitCode) across
# all three script contexts: type:script step, preCondition, and endCondition.
# Pre-conditions that fail use onFail:skipPrompt to advance without running the AI.
#
# Expected behavior:
#   Steps 1-4  (scriptStep): one per compareSource — all pass
#   Steps 5-8  (promptStep): preConditions intentionally fail on each compareSource — all skipped
#   Step  9    (promptStep): only AI prompt that runs; priorContext [1,2,3,4] injects all four
#                            script step outputs; endCondition uses compareSource:exitCode

harness: copilot-cli
model: gpt-5-mini

steps:
  # ── Script steps: one per compareSource ──────────────────────────────────────

  # Default comparison (no fields): passes when the script exits 0.
  # Writes to both stdout and stderr so all three fields appear in priorContext XML.
  - name: script-default-exit
    type: script
    script: manual-test/.ctrlyoke/scripts/forward.js default-stdout default-stderr 0
    timeoutSec: 10

  # compareSource stdout: stdout must equal "stdout-match". The exit code is NOT
  # a hidden second condition — only the text is compared.
  - name: script-stdout
    type: script
    script: manual-test/.ctrlyoke/scripts/forward.js stdout-match x 0
    compareSource: stdout
    expected: stdout-match
    timeoutSec: 10

  # compareSource stderr: stderr must equal "stderr-match"; exit code is ignored
  # Intentionally exits 1 to prove exit code is not evaluated in stderr mode.
  - name: script-stderr
    type: script
    script: manual-test/.ctrlyoke/scripts/forward.js x stderr-match 1
    compareSource: stderr
    expected: stderr-match
    onFail: continue
    timeoutSec: 10

  # compareSource exitCode: exit code must equal 42; stdout/stderr are ignored
  - name: script-exitcode
    type: script
    script: manual-test/.ctrlyoke/scripts/forward.js x x 42
    compareSource: exitCode
    expected: 42
    onFail: continue
    timeoutSec: 10

  # ── Prompts with failing preConditions → all skipped ─────────────────────────

  # default comparison: exits 1, so the "exits 0" default fails → skip
  - name: skip-default-exit
    prompt: >-
      ERROR: This step should be skipped (preCondition exit 1).
      Please respond with: "ERROR - step was not skipped."
    preCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js x x 1
      onFail: skipPrompt

  # stdout: writes "wrong" but expects "right" → mismatch → fails → skip
  - name: skip-stdout
    prompt: >-
      ERROR: This step should be skipped (preCondition stdout mismatch).
      Please respond with: "ERROR - step was not skipped."
    preCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js wrong x 0
      compareSource: stdout
      expected: right
      onFail: skipPrompt

  # stderr: writes "wrong-err" to stderr but expects "right-err" → mismatch → fails → skip
  - name: skip-stderr
    prompt: >-
      ERROR: This step should be skipped (preCondition stderr mismatch).
      Please respond with: "ERROR - step was not skipped."
    preCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js x wrong-err 0
      compareSource: stderr
      expected: right-err
      onFail: skipPrompt

  # exitCode: exits 2 but expects 0 → mismatch → fails → skip
  - name: skip-exitcode
    prompt: >-
      ERROR: This step should be skipped (preCondition exitCode mismatch).
      Please respond with: "ERROR - step was not skipped."
    preCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js x x 2
      compareSource: exitCode
      expected: 0
      onFail: skipPrompt

  # ── Final verification prompt ─────────────────────────────────────────────────

  # preCondition passes (default comparison, exit 0).
  # priorContext [1,2,3,4] injects all four script step outputs — each should include
  # <stdout>, <stderr>, and <exitCode> tags (steps 3 and 4 have non-zero exit codes).
  # endCondition uses compareSource:exitCode; forward.js exits 0, expected:0 → passes.
  - name: verify-all-compareSource
    prompt: |
      You have received prior context from four script steps, each using a different
      compareSource option (default exit code, stdout, stderr, exitCode).

      Look at the <priorContext> XML block in your input. For each <step>, note which
      of <stdout>, <stderr>, and <exitCode> tags are present and quote their values.

      Then confirm with:
      "compareSource coverage verified. [list each step name with its output tag values]"
    priorContext: [1, 2, 3, 4]
    preCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js pass x 0
    endCondition:
      script: manual-test/.ctrlyoke/scripts/forward.js x x 0
      compareSource: exitCode
      expected: 0
