# YAML Multi-Step Test
# Tests multi-step workflows with session continuity in YAML format

steps:
  - name: step1
    prompt: |
      This is step 1. Remember the number: 42
    resumeSession: false

  - name: step2
    prompt: |
      What number did I tell you to remember in step 1?
    resumeSession: true

# Expected: Step 2 should recall "42"
