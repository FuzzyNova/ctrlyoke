# Session Resume Test
# Tests that sessions maintain context across prompts (resumeSession flag)

harness: copilot-cli
model: gpt-5-mini

prompts:
  - name: remember-info
    prompt: |
      We are testing FlightPath session management. Remember: My favorite color is orange.
    resumeSession: false

  - name: recall-info
    prompt: |
      What is my favorite color?
    resumeSession: true

# Expected behavior:
# 1. First prompt starts new session with the info
# 2. Second prompt continues session and should recall "orange"
# 3. If it can't recall, session resume failed
