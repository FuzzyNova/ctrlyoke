# Test YAML Workflow - File References
# Tests YAML with #file: references and context awareness

prompts:
  - id: review-yaml-support
    prompt: |
      Review the YAML workflow format implementation in FlightPath.

      Examine @src/flightpath/PromptFileParser.ts and check:
      - How YAML files are parsed
      - Error handling for invalid YAML syntax
      - Schema validation with AJV

      Provide specific feedback on code quality and potential improvements.
    provider: copilot-cli
    model: gpt-5-mini
    newChatSession: true
    endCondition:
      script: npm run compile
      returns: "true"
      maxRetries: 5
      timeout: 2500
