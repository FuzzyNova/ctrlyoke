prompts:
  - name: test-all-properties
    prompt: |
      This is a test prompt to verify all properties sync correctly to the dashboard UI.

      When loading this workflow and clicking on this prompt to edit it, the properties drawer should show:
      - Harness: copilot-cli
      - Model: claude-sonnet-4.5
      - Agent: test-agent
      - Resume Session: Yes
      - Allow Dynamic Extension: Yes
      - End Condition: Script, Returns, Timeout, Max Retries, Retry Prompt all filled in
    harness: copilot-cli
    model: claude-sonnet-4.5
    agent: test-agent
    resumeSession: true
    allowDynamicExtension: true
    endCondition:
      script: .flightpath/scripts/always_true.py
      returns: "true"
      timeout: 45000
      maxRetries: 3
      retryPrompt: |
        Validation failed: {errorOutput}

        Expected: {expectedValue}
        Actual: {actualValue}
        Retry {retryCount} of {maxRetries}

        Please fix the issues and try again.

  - name: test-minimal-properties
    prompt: |
      This is a test prompt with NO end condition properties.

      When loading this workflow and clicking on this prompt to edit it, the properties drawer should show:
      - Harness: claude-cli
      - Model: sonnet
      - Agent: (empty)
      - Resume Session: No
      - Allow Dynamic Extension: No
      - End Condition: All fields should be empty/default
    harness: claude-cli
    model: sonnet
    resumeSession: false
    allowDynamicExtension: false
