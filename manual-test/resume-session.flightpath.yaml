# Test YAML Workflow - Basic Example
# Tests basic YAML parsing and execution

prompts:
  - id: resume-session-test
    prompt: |
      We are testing session resume feature of FlightPath. Remember this info: My favorite color is orange, my favorite number is 115, and my favorite animal is a snake.
    newChatSession: true
  - id: resume-session-continue
    prompt: |
      this should continue the previous session. What is my favorite color, number, and animal?
    newChatSession: false
