_templateMeta:
  name: Spec-Driven Loop
  description: "Orchestrator loop. Give it a spec/design doc — it breaks the work into steps, queues them, then reviews and keeps looping until every requirement is satisfied."
  variables:
    specFile:
      type: file
      fileFilter:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.yaml"
        - "**/*.json"
      autoFillFilename: true

# Every queued step is its own island: a fresh session that gets all the context
# it needs from its own prompt and the repo. Chaining them into one session just
# drives that session into repeated compaction as it tries to hold every step at
# once. The finalStep overrides this for itself — see below.
resumeSession: false

# No prompts up front — deliberately. Most specs need more than one session of
# work, and a fixed "implement it all" step just fails and leaves the loop to
# clean up. Instead the queue starts empty and the orchestrator decides how to
# split the work, then appends the steps itself via ctrlyoke_append_queue.
# Everything it queues runs before the final step comes back around to review.
steps: []

finalStep:
  name: orchestrate
  agent: spec-orchestrator
  mcpServers:
    - ctrlyoke
  # The orchestrator is the one exception to the workflow-level resumeSession:
  # false above. It resumes its own session on every loop, so it remembers the
  # plan it staged and does not re-derive it. Prior context stays off: it reads
  # the repo (and ctrlyoke_read_output when it needs a step's report) instead of
  # inlining every step's output into the prompt.
  resumeSession: true
  sessionId: finalStep
  priorContext: none
  prompt: |
    Be my ctrlyoke orchestrator for this specification:
    @{file:specFile}

    Your first job is to review the spec and the codebase it touches, then use the
    ctrlyoke_append_queue tool to add one step for each chunk of work that can
    reasonably be completed in a single session, in the correct staging order.
    Update the spec first if you find a clear problem with it; if the plan needs more
    thought than you can give it here, make finalizing the plan the first queued step.
    Use your judgment on how to split the work — that judgment is the point of this
    workflow. Every queued step must be self-contained, must keep the planning docs
    current, and must commit its own work before finishing.

    The next time you see this prompt, all your queued steps will have run. Verify the
    work is actually complete, inspect it, fix any errors you find, and commit your
    cleanup. If a large chunk is still missing or wrong, append more steps and let the
    loop continue. Once everything is done, give me a real summary of what was built
    and end your turn.

    You don't need to work out whether this is the first time you've seen this prompt —
    you're resuming your own session, so read the state and act accordingly.
