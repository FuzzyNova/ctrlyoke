_templateMeta:
  name: Spec-Driven Loop
  description: "Orchestrator loop. Give it a spec/design doc — it breaks the work into steps, queues them, then reviews and keeps looping until every requirement is satisfied."
  variables:
    specFile:
      type: file
      fileFilter:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.yaml"
        - "**/*.json"
      autoFillFilename: true

# Every queued step is its own island: a fresh session that gets all the context
# it needs from its own prompt and the repo. Chaining them into one session just
# drives that session into repeated compaction as it tries to hold every step at
# once. The plan step and finalStep are the exception — see below.
resumeSession: false
priorContext: none

# Only the plan step is queued up front, so it's visible right away instead of
# hidden behind the finalStep. It reviews the spec and the codebase, then appends
# one step per chunk of work via append_step. It can also edit, remove, or
# reorder pending work when review discovers a correction. Everything it queues runs
# before the final step comes back around to review.
steps:
  - name: plan
    agent: spec-orchestrator
    mcpServers:
      - ctrlyoke
    prompt: |
      Be my ctrlyoke orchestrator for this specification:
      @{file:specFile}

      Review the spec and the codebase it touches, then use the append_step
      tool to add one step for each chunk of work that can reasonably be completed in a
      single session, in the correct staging order. Update the spec first if you find a
      clear problem with it; if the plan needs more thought than you can give it here,
      make finalizing the plan the first queued step. Use your judgment on how to split
      the work — that judgment is the point of this workflow. Every queued step must be
      self-contained, must keep the planning docs current, and must commit its own work
      before finishing.

      Once you've queued the plan, end your turn. A review pass will run automatically
      after everything you queued has completed.

finalStep:
  name: review
  agent: spec-orchestrator
  mcpServers:
    - ctrlyoke
  # The orchestrator resumes the session it started for the plan step above on
  # every review pass, so it remembers the plan it staged and does not re-derive
  # it. Prior context stays off: it reads the repo (and read_output when
  # it needs a step's report) instead of inlining every step's output into the
  # prompt.
  resumeSession: true
  sessionId: 1
  prompt: |
    Resume your ctrlyoke orchestrator session for this specification:
    @{file:specFile}

    All the steps you queued should have run by now. Verify the work is actually
    complete, inspect it, fix any errors you find, and commit your cleanup. If a large
    chunk is still missing or wrong, use edit_step/remove_step/reorder_steps for
    pending work or append_step to add more steps and
    let the loop continue. Once everything is done, give me a real summary of what was
    built and end your turn.

    You don't need to work out whether this is your first review pass — you're
    resuming your planning session, so read the state and act accordingly.
