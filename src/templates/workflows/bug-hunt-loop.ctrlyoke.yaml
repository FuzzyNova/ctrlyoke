schemaVersion: 1
_templateMeta:
  name: Bug Hunt Loop
  description: "Open-ended loop. Each pass reviews the last round of fixes, files at least two new bugs as Markdown files in your repo, and queues their fixes. Runs until you stop it, a pass finds nothing, or it reaches the step limit."
  variables:
    bugBacklogDir:
      type: directory
      default: bugs/backlog
      description: Where new bug reports are filed, one Markdown file per bug. Add a README or template here describing your bug report format and the hunter will follow it.
    bugImplementedDir:
      type: directory
      default: bugs/implemented
      description: Where a fix step moves its bug report once the bug is fixed.
    testCommand:
      type: text
      default: npm test
      description: Your test suite. Every queued fix must pass it.
    hunterHarness:
      type: harness
      default: claude-cli
      description: Runs the bug hunter (the final step).
    hunterModel:
      type: model
      harness: hunterHarness
      default: opus
      description: Use your most capable model; finding real bugs takes judgment.
    fixerHarness:
      type: harness
      default: codex-cli
      description: Runs every queued fix step.
    fixerModel:
      type: model
      harness: fixerHarness
      default: gpt-6-luna
      description: A cheaper model is usually enough for a well-described fix.

# Bug reports live in your repo, not an issue tracker: the queued fix steps and
# the next hunting pass read them from {bugBacklogDir}. A README or template in
# that directory describing the report format makes every report consistent.
# The Bug Drain Loop template fixes an existing backlog in the same layout.
#
# Queued fix steps inherit these workflow defaults; the final step overrides
# the harness and model. Every queued step runs in a fresh, self-contained
# session.
resumeSession: false
priorContext: none
harness: "{fixerHarness}"
model: "{fixerModel}"
executionMode: headless

# No up-front steps: the first pass finds an empty history, skips the review,
# and goes straight to hunting. The loop ends only when a pass queues nothing,
# so in practice it runs until you stop it or it reaches the step limit.
steps: []

finalStep:
  name: hunt-bugs
  harness: "{hunterHarness}"
  model: "{hunterModel}"
  mcpServers:
    - ctrlyoke
  # Each pass is a fresh session. A summary of the previous pass (its files
  # changed and closing text) is attached so it can hunt somewhere new or follow
  # up on the last round of fixes; read_output has the full record.
  resumeSession: false
  priorContext: finalStepPrevious
  priorContextDetail: summary
  prompt: |
    Your goal is to review the bugs fixed since the previous pass, then find and file at
    least two new bugs in this project and queue their fixes.

    You run as this workflow's final step. Every pass is a new session, so you have no
    memory of earlier passes; a summary of the previous pass (if any) is attached above. Use
    it to hunt in a different part of the codebase, or to queue follow-up work if the last
    round of fixes needs it. Use workflow_status and read_output for more detail.

    ## 1. Review the last round of fixes

    Use workflow_status to find the steps that ran since the previous pass. If there are
    none, skip to section 2. If a step only merged in another branch, don't review it as a
    bug fix, but do account for what it brought in.

    Review every bug fix that landed in that window (git log and the diffs). Confirm each
    one actually fixes its bug, didn't introduce a regression, has test coverage, and moved
    its bug report to {bugImplementedDir}. Fix the problems you find and commit them. If a
    follow-up is too big for this session, use append_step to queue it.

    ## 2. Hunt for new bugs

    Find at least two new high-confidence bugs. Ways to find them:
    - Read the source code.
    - Run the application, its CLI, or its tests and look for wrong behavior.
    - Read recent git history. Recently landed changes have had the least testing, so
      they're the most likely to contain bugs.
    - Check the documentation against what the code actually does.
    - Look for security vulnerabilities.

    Before you file anything:
    - Check {bugBacklogDir} and {bugImplementedDir}, plus any rejected or won't-fix bugs
      the project keeps, so you don't file a duplicate or something already rejected.
    - Rule out intended behavior. Some things look like bugs but are documented design
      choices. Check the docs, the project's agent instructions, and any design notes
      before calling something a bug.
    - If a bug is low confidence, try to raise your confidence by writing a failing test or
      reproducing it.

    ## 3. File and queue

    File each bug as its own Markdown file in {bugBacklogDir}. If that directory, or the
    directory above it, has a README or template for bug reports, follow it. Otherwise give
    each report a title, a severity, the steps to reproduce, the expected and actual
    behavior, the evidence (file paths and line numbers), and a suggested fix.

    Then decide whether to queue a fix:
    - High-confidence bugs with a clear fix: use append_step to queue a step that fixes the
      bug, adds or updates tests, passes `{testCommand}`, moves the bug report to
      {bugImplementedDir} (git mv) with a note that it was fixed in this commit, and
      commits its own work. Group closely related bugs into one step when that's simpler.
      Every queued step runs in a fresh session with none of your reasoning, so make its
      prompt self-contained: name the bug report, the files involved, and what done looks
      like.
    - Security vulnerabilities with a straightforward fix: file and queue as above.
    - Security vulnerabilities whose fix requires a behavior change: file the bug, but
      don't queue a fix. Flag it in your summary.
    - Low-confidence bugs, and bugs whose fix needs a major design change: file them, but
      don't queue a fix. Flag each one in your summary as low confidence or needing a
      design change.

    Commit the bug reports you filed before you end your turn.

    If you find no high-confidence bugs and truly believe this part of the codebase is
    bug-free, say so and end your turn without queuing anything. That ends the workflow.

    End with a short summary: what you reviewed and fixed, which bugs you filed and queued,
    and everything flagged for me (security issues needing a behavior change,
    low-confidence bugs, design-change bugs).

    You are running headless, so you can't ask questions. Use your best judgment, and if
    you truly need my input, say so in your summary and end your turn without queuing
    steps. When your turn ends your process stops and kills any subprocesses you started,
    so don't end your turn to wait on a task; block on long-running commands such as
    `{testCommand}` instead, and stop any server you started before you end your turn.
