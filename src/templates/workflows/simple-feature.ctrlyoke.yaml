schemaVersion: 1
_templateMeta:
  name: Simple Feature
  description: "Plan → Implement → Commit in a single session for a small, focused change."
  variables:
    featureDescription:
      type: text
      multiline: true
      description: What to build — describe the feature or change in a sentence or two.

# prompts
steps:
  - name: plan
    prompt: |
      {featureDescription}

      Create an implementation plan for this feature. Identify all files that need changes and outline the approach.

  - name: implement
    prompt: |
      Implement the plan you just created. Make all necessary code changes.
    resumeSession: true

  - name: commit
    prompt: |
      Generate a conventional commit message for the changes. Format: feat(scope): description
    resumeSession: true
