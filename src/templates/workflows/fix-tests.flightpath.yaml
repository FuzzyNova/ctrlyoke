_templateMeta:
  name: Fix Tests
  description: Run tests and fix failures with retry

# prompts
steps:
  - name: fix-tests
    prompt: |
      There are currently failing tests. Run {testCommand} to see which tests are failing, then fix them.
    endCondition:
      script: "{testCommand}"
      returns: "true"
      maxRetries: 5
      retryPrompt: |
        Tests are still failing. Please fix the remaining issues:
        {scriptOutput}
