# Fix Tests Workflow
# Automated test fixing with retry logic

prompts:
  - id: fix-tests
    prompt: |
      There are currently failing tests. Run {testCommand} to see which tests are failing, then fix them.
    endCondition:
      script: "{testCommand}"
      returns: "true"
      maxRetries: 5
      retryPrompt: |
        Tests are still failing. Please fix the remaining issues:
        {scriptOutput}
