# yaml-language-server: $schema=https://ctrlyoke.dev/schema/v1/workflow.json
schemaVersion: 1
_templateMeta:
  name: Fix Tests
  description: Run tests and fix failures with a validation retry loop until they pass.
  variables:
    testCommand:
      type: text
      default: npm test
      description: The command that runs your test suite (e.g. npm test, pytest, cargo test).

# prompts
steps:
  - name: fix-tests
    agent: test-repair
    prompt: |
      There are currently failing tests. Run {testCommand} to see which tests are failing, then fix them.
    endCondition:
      script: "{testCommand}"
      maxRetries: 5
      retryPrompt: |
        Tests are still failing. Please fix the remaining issues:
        $endCondition:stdout
