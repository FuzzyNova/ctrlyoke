<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}}; font-src {{cspSource}};"
    />
    <link rel="stylesheet" href="{{codiconsUri}}" />
    <link rel="stylesheet" href="{{sharedStyleUri}}" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>FlightPath Settings</title>
  </head>
  <body>
    <div id="settings-app">
      <!-- Row 1: Provider, Model -->
      <div class="settings-row">
        <div class="setting-group">
          <label for="provider-dropdown">Provider</label>
          <select
            id="provider-dropdown"
            title="Select AI provider for prompt execution"
          >
            <!-- Populated dynamically with availability status -->
          </select>
          <span class="setting-description">Choose which AI provider to use</span>
        </div>

        <div class="setting-group">
          <label for="model-dropdown">Model</label>
          <select id="model-dropdown" title="Select AI model">
            <!-- Populated dynamically based on provider -->
          </select>
          <span class="setting-description">AI model for prompt execution</span>
        </div>
      </div>

      <!-- Row 2: Agent, New Chat Session -->
      <div class="settings-row">
        <div class="setting-group">
          <label for="agent-dropdown">Agent</label>
          <select id="agent-dropdown" title="Select Copilot agent">
            <option value="default">Default</option>
            <option value="workspace">@workspace</option>
            <option value="vscode">@vscode</option>
            <option value="terminal">@terminal</option>
            <option value="github">@github</option>
          </select>
          <span class="setting-description">Copilot agent to use</span>
        </div>

        <div class="setting-group">
          <label class="checkbox-label">
            <input type="checkbox" id="new-chat-session-checkbox" />
            <span>New Chat Session Per Prompt</span>
          </label>
          <span class="setting-description"
            >Start fresh chat session for each prompt</span
          >
        </div>
      </div>

      <!-- Row 3: Execution Mode, Dynamic Queue -->
      <div class="settings-row">
        <div class="setting-group" id="execution-mode-group">
          <label for="execution-mode-dropdown">Execution Mode</label>
          <select id="execution-mode-dropdown" title="Select CLI execution mode">
            <option value="interactive">Interactive</option>
            <option value="headless">Headless</option>
          </select>
          <span class="setting-description"
            >Interactive shows terminal, headless runs in background</span
          >
        </div>

        <div class="setting-group">
          <label class="checkbox-label">
            <input type="checkbox" id="dynamic-queue-checkbox" />
            <span>Enable Dynamic Queue Extension</span>
          </label>
          <span class="setting-description"
            >Allow prompts to extend the workflow queue</span
          >
        </div>
      </div>

      <!-- More Settings Button (centered at bottom) -->
      <div class="more-settings-container">
        <button id="more-settings-btn" class="more-settings-btn" title="Open FlightPath settings in VS Code">
          <i class="codicon codicon-settings-gear"></i>
          <span>More Settings</span>
        </button>
      </div>
    </div>

    <!-- Load constants first (SINGLE SOURCE OF TRUTH) -->
    <script src="{{constantsUri}}"></script>
    <!-- Then load settings view logic -->
    <script src="{{scriptUri}}"></script>
  </body>
</html>
