<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src {{cspSource}}; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}}; font-src {{cspSource}}; img-src data:;"
    />
    <link rel="stylesheet" href="{{codiconsUri}}" />
    <link rel="stylesheet" href="{{customIconsUri}}" />
    <link rel="stylesheet" href="{{sharedStyleUri}}" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>FlightPath Dashboard</title>
  </head>
  <body data-aff-uri="{{affUri}}" data-dic-uri="{{dicUri}}">
    <div id="app">
      <div id="header">
        <div id="action-buttons">
          <!-- Split dropdown button -->
          <div class="split-button">
            <!-- Main button (left side) -->
            <button
              id="btn-new-workflow-main"
              class="split-button-main btn-secondary btn-small"
              title="Clear current workflow and start blank"
            >
              <i class="codicon codicon-new-file"></i>
              <span class="btn-text">Create Workflow</span>
            </button>

            <!-- Dropdown trigger (right side) -->
            <button
              id="btn-workflow-dropdown"
              class="split-button-dropdown btn-secondary btn-small"
              title="Show more workflow options"
              aria-label="Show workflow loading options"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="workflow-dropdown-menu"
            >
              <i class="codicon codicon-chevron-down"></i>
            </button>

            <!-- Dropdown menu (hidden by default) -->
            <div
              id="workflow-dropdown-menu"
              class="dropdown-menu"
              role="menu"
              aria-label="Workflow options"
              hidden
            >
              <button
                class="dropdown-item"
                data-action="from-template"
                role="menuitem"
              >
                <i class="custom-icon icon-from-template"></i>
                From Template...
              </button>
              <div class="dropdown-divider"></div>
              <button
                class="dropdown-item"
                data-action="load-file"
                role="menuitem"
              >
                <i class="custom-icon icon-load-from-file"></i>
                Load from File...
              </button>
              <button
                class="dropdown-item"
                data-action="queue-file"
                role="menuitem"
                disabled
              >
                <i class="custom-icon icon-queue-from-file"></i>
                Queue from File...
              </button>
            </div>
          </div>
        </div>

        <div id="workflow-status">
          <!-- Split button container -->
          <div class="workflow-split-button" style="display: none">
            <!-- Main button (workflow name + state) -->
            <button
              id="btn-workflow-main"
              class="workflow-button-main btn-tertiary"
              title="Click to edit workflow name"
              aria-label="Workflow name and status"
            >
              <span id="workflow-display">
                <span id="workflow-name">New Workflow</span>
                <span id="status-separator" class="status-separator">-</span>
                <span id="execution-state" class="execution-state-idle"
                  >Idle</span
                >
              </span>
            </button>

            <!-- Dropdown trigger (recent workflows) -->
            <button
              id="btn-workflow-status-dropdown"
              class="workflow-button-dropdown btn-tertiary"
              title="Show recent workflows"
              aria-label="Show recent workflows"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="workflow-recent-menu"
              disabled
            >
              <i class="codicon codicon-chevron-down"></i>
            </button>

            <!-- Dropdown menu (recent workflows) -->
            <div
              id="workflow-recent-menu"
              class="workflow-dropdown-menu"
              role="menu"
              aria-label="Recent workflows"
              hidden
            >
              <div class="workflow-menu-header">Recent Workflows</div>
              <div id="workflow-menu-items" class="workflow-menu-items">
                <!-- Populated dynamically -->
              </div>
              <div class="workflow-menu-footer">
                <button
                  class="workflow-menu-action"
                  data-action="clear-history"
                >
                  Clear History
                </button>
              </div>
            </div>
          </div>

          <!-- Inline edit input (hidden by default) -->
          <input
            id="workflow-name-edit"
            class="workflow-name-edit-input"
            type="text"
            maxlength="100"
            placeholder="Workflow name"
            style="display: none"
            aria-label="Edit workflow name"
          />

          <!-- Fallback for no workflow loaded -->
          <span id="workflow-empty-state" class="workflow-empty-state">
            No workflow loaded
          </span>
        </div>

        <div id="controls">
          <div id="layout-toggle" class="layout-toggle">
            <button
              id="btn-layout-vertical"
              class="btn-layout active"
              title="Stack vertically"
              aria-label="Stack output and editor vertically"
            >
              <i class="codicon codicon-split-vertical"></i>
            </button>
            <button
              id="btn-layout-horizontal"
              class="btn-layout"
              title="Stack horizontally"
              aria-label="Stack output and editor horizontally"
            >
              <i class="codicon codicon-split-horizontal"></i>
            </button>
            <button
              id="btn-swap-panels"
              class="btn-layout"
              title="Swap output and editor positions"
              aria-label="Swap output and editor positions"
            >
              <i class="codicon codicon-arrow-swap"></i>
            </button>
          </div>
          <span class="button-divider"></span>
          <button id="btn-run" class="btn-primary" title="Run">▶</button>
          <button id="btn-pause" class="btn-secondary" title="Pause" disabled>
            ⏸
          </button>
          <button id="btn-stop" class="btn-secondary" title="Stop" disabled>
            ⏹
          </button>
        </div>
      </div>

      <div id="main-content">
        <!-- Left side: Prompts -->
        <div id="prompts-section">
          <div class="section-header">
            <div class="section-title-group">
              <button
                id="btn-collapse-prompts"
                class="btn-collapse"
                title="Collapse prompts section"
                aria-label="Collapse prompts"
              >
                <i class="codicon codicon-chevron-down collapse-icon"></i>
              </button>
              <i class="codicon codicon-tasklist section-icon"></i>
              <h3>Prompts</h3>
            </div>
            <span id="prompt-counter" class="prompt-counter"></span>
          </div>
          <div id="prompts-list">
            <div class="empty-state">Select a prompt file to begin</div>
          </div>
        </div>

        <!-- Right side: Output + Editor (chat-like layout) -->
        <div id="output-editor-container">
          <!-- Output section (always visible, top) -->
          <div id="output-section">
            <div class="section-header">
              <div class="section-title-group">
                <button
                  id="btn-collapse-output"
                  class="btn-collapse"
                  title="Collapse output section"
                  aria-label="Collapse output"
                >
                  <i class="codicon codicon-chevron-down collapse-icon"></i>
                </button>
                <i class="codicon codicon-terminal section-icon"></i>
                <h3>Output</h3>
              </div>
              <div class="output-controls">
                <label class="autoscroll-toggle">
                  <input type="checkbox" id="autoscroll-checkbox" checked />
                  <span>Autoscroll</span>
                </label>
                <button
                  id="btn-export"
                  class="btn-secondary btn-small"
                  title="Export output to markdown file"
                >
                  Export
                </button>
              </div>
            </div>

            <div id="output-content">
              <div class="empty-state">No output yet</div>
            </div>
          </div>

          <!-- Editor section (always visible, bottom) -->

          <div id="editor-section">
            <div class="section-header editor-header">
              <div class="section-title-group">
                <button
                  id="btn-collapse-editor"
                  class="btn-collapse"
                  title="Collapse editor section"
                  aria-label="Collapse editor"
                >
                  <i class="codicon codicon-chevron-down collapse-icon"></i>
                </button>
                <i class="codicon codicon-edit section-icon"></i>
                <h3>Prompt Editor</h3>
              </div>
              <div class="editor-controls">
                <div class="editor-mode-info">
                  <span id="editor-mode-indicator">New Prompt</span>
                  <input
                    type="text"
                    id="prompt-name-input"
                    class="prompt-name-input"
                    placeholder="Prompt name (optional)"
                  />
                </div>
                <button
                  id="btn-new-prompt"
                  class="btn-secondary btn-small"
                  title="Start a new prompt"
                  style="display: none"
                >
                  New Prompt
                </button>
              </div>
            </div>

            <div class="prompt-editor-wrapper">
              <div id="prompt-editor" class="prompt-editor">
                <!-- CodeMirror will be initialized here -->
              </div>

              <!-- Properties Drawer (moved inside editor wrapper) -->
              <div id="properties-drawer" class="properties-drawer">
                <div class="drawer-content">
                  <div class="drawer-header">
                    <h3>Prompt Properties</h3>
                    <button
                      id="btn-close-drawer"
                      class="btn-close-drawer"
                      title="Close properties"
                    >
                      <i class="codicon codicon-close"></i>
                    </button>
                  </div>

                  <div class="drawer-body">
                    <div class="property-row">
                      <div class="property-group">
                        <label for="prop-provider">Provider:</label>
                        <select id="prop-provider" class="property-select">
                          <option value="default" selected>Default</option>
                          <option value="copilot-cli">Copilot CLI</option>
                          <option value="copilot-chat">Copilot Chat</option>
                          <option value="claude-cli">Claude CLI</option>
                          <option value="codex-cli">Codex CLI</option>
                        </select>
                      </div>

                      <div class="property-group">
                        <label for="prop-model">Model:</label>
                        <select id="prop-model" class="property-select">
                          <option value="default" selected>Default</option>
                          <!-- Populated dynamically -->
                        </select>
                      </div>
                    </div>

                    <div class="property-row">
                      <div class="property-group">
                        <label for="prop-agent">Agent:</label>
                        <input
                          type="text"
                          id="prop-agent"
                          class="property-input"
                          placeholder="Default (leave empty)"
                        />
                      </div>

                      <div class="property-group">
                        <label for="prop-new-chat">New Chat Session:</label>
                        <select id="prop-new-chat" class="property-select">
                          <option value="default" selected>Default</option>
                          <option value="yes">Yes</option>
                          <option value="no">No</option>
                        </select>
                      </div>
                    </div>

                    <div class="property-row">
                      <div class="property-group full-width">
                        <label for="prop-allow-dynamic"
                          >Allow Dynamic Extension:</label
                        >
                        <select id="prop-allow-dynamic" class="property-select">
                          <option value="default" selected>Default</option>
                          <option value="yes">Yes</option>
                          <option value="no">No</option>
                        </select>
                      </div>
                    </div>

                    <details class="end-condition-section">
                      <summary>End Condition (optional)</summary>
                      <div class="end-condition-controls">
                        <div class="property-group">
                          <label for="prop-end-script">Script:</label>
                          <input
                            type="text"
                            id="prop-end-script"
                            class="property-input"
                            placeholder="npm test"
                          />
                        </div>
                        <div class="property-group">
                          <label for="prop-end-returns">Returns:</label>
                          <input
                            type="text"
                            id="prop-end-returns"
                            class="property-input"
                            placeholder="true"
                          />
                        </div>
                        <div class="property-group">
                          <label for="prop-end-timeout">Timeout (ms):</label>
                          <input
                            type="number"
                            id="prop-end-timeout"
                            class="property-input"
                            value="30000"
                            min="1000"
                          />
                        </div>
                        <div class="property-group">
                          <label for="prop-end-retries">Max Retries:</label>
                          <input
                            type="number"
                            id="prop-end-retries"
                            class="property-input"
                            value="0"
                            min="-1"
                          />
                        </div>
                        <div class="property-group full-width">
                          <label for="prop-end-retry-prompt"
                            >Retry Prompt:</label
                          >
                          <textarea
                            id="prop-end-retry-prompt"
                            class="property-textarea"
                            rows="2"
                            placeholder="Validation failed: {error}

Please fix the issues."
                          ></textarea>
                        </div>
                      </div>
                    </details>
                  </div>
                </div>
              </div>
              <!-- Close properties-drawer -->
            </div>
            <!-- Close prompt-editor-wrapper -->

            <div class="editor-footer">
              <div class="editor-footer-left">
                <button
                  id="btn-properties"
                  class="btn-secondary btn-small"
                  title="Toggle properties panel"
                >
                  <i class="codicon codicon-symbol-property"></i>
                  <span class="btn-text">Properties</span>
                </button>
              </div>

              <div class="editor-metadata">
                <span id="editor-token-count">0 tokens</span>
              </div>

              <div class="editor-actions">
                <label
                  id="new-workflow-toggle"
                  class="new-workflow-toggle"
                  title=""
                  hidden
                >
                  <input type="checkbox" id="new-workflow-checkbox" />
                  <span>New Workflow</span>
                </label>
                <!-- New Prompt Mode Buttons -->
                <button
                  id="btn-editor-queue"
                  class="btn-secondary"
                  title="Add prompt to execution queue"
                >
                  <i class="codicon codicon-add"></i>
                  <span class="btn-text">Queue</span>
                </button>
                <button
                  id="btn-editor-run"
                  class="btn-primary"
                  title="Add to queue and start execution"
                >
                  <i class="codicon codicon-send"></i>
                  <span class="btn-text">Run</span>
                </button>

                <!-- Edit Existing Mode Buttons (hidden by default) -->
                <button
                  id="btn-editor-cancel"
                  class="btn-secondary"
                  style="display: none"
                  title="Cancel editing"
                >
                  <i class="codicon codicon-discard"></i>
                  <span class="btn-text">Cancel</span>
                </button>
                <button
                  id="btn-editor-update"
                  class="btn-primary"
                  style="display: none"
                  title="Update prompt"
                >
                  <i class="codicon codicon-check"></i>
                  <span class="btn-text">Update</span>
                </button>
                <button
                  id="btn-editor-delete"
                  class="btn-secondary"
                  style="display: none"
                  title="Delete prompt"
                >
                  <i class="codicon codicon-trash"></i>
                  <span class="btn-text">Delete</span>
                </button>
              </div>
            </div>
          </div>
          <!-- Close editor-section -->
        </div>
        <!-- Close output-editor-container -->
      </div>
      <!-- Close main-content -->

      <!-- New Workflow Modal -->
      <div id="new-workflow-modal" class="modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content">
          <div class="modal-header">
            <h2>New Workflow</h2>
            <button class="modal-close" title="Close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="template-section">
              <label for="template-select">Template:</label>
              <select id="template-select">
                <!-- Populated dynamically -->
              </select>
              <div class="default-template-row">
                <button
                  id="set-default-btn"
                  class="btn-link"
                  title="Set as default template"
                >
                  Set as Default
                </button>
                <span
                  id="default-confirmation"
                  class="confirmation-message"
                  hidden
                  >✓ Set as default</span
                >
              </div>
            </div>
            <p id="template-description" class="template-description"></p>

            <div id="variables-section" class="variables-section" hidden>
              <!-- Variable inputs populated dynamically -->
            </div>

            <div class="filename-section">
              <label for="workflow-name">Workflow name:</label>
              <div class="filename-input-group">
                <input
                  type="text"
                  id="workflow-name"
                  placeholder="my-workflow"
                />
                <span class="filename-extension">.flightpath.json</span>
              </div>
              <p id="save-path-preview" class="save-path-preview"></p>
              <p id="filename-error" class="error-message" hidden></p>
            </div>
          </div>
          <div class="modal-footer">
            <button id="modal-cancel" class="btn-secondary">Cancel</button>
            <button id="modal-create" class="btn-secondary">Create</button>
            <button id="modal-create-run" class="btn-primary">
              Create & Run
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal (for delete, etc.) -->
    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-overlay"></div>
      <div class="modal-content modal-content-small">
        <div class="modal-header">
          <h2 id="confirm-title">Confirm</h2>
        </div>
        <div class="modal-body">
          <p id="confirm-message">Are you sure?</p>
        </div>
        <div class="modal-footer">
          <button id="confirm-cancel" class="btn-secondary">Cancel</button>
          <button id="confirm-ok" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <!-- Load constants first (SINGLE SOURCE OF TRUTH) -->
    <script src="{{constantsUri}}"></script>
    <!-- Load gpt-tokenizer (exposes window.gptTokenizer) -->
    <script src="{{gptTokenizerUri}}"></script>
    <!-- Load Typo.js for spell checking (KEEP - needed for Electron) -->
    <script src="{{typoUri}}"></script>
    <!-- Load CodeMirror modules -->
    <script type="module" src="{{codemirrorLoaderUri}}"></script>
    <!-- Load CodeMirror prompt editor -->
    <script src="{{codemirrorEditorUri}}"></script>

    <!-- Load FlightPath modules (dependency order matters) -->
    <!-- 1. Utilities (no dependencies) -->
    <script src="{{utilitiesUri}}"></script>
    <!-- 2. State Manager (depends on utilities for some defaults) -->
    <script src="{{stateManagerUri}}"></script>
    <!-- 3. Feature Managers (depend on state manager and utilities) -->
    <script src="{{outputManagerUri}}"></script>
    <script src="{{workflowManagerUri}}"></script>
    <script src="{{editorManagerUri}}"></script>
    <script src="{{promptsManagerUri}}"></script>
    <!-- 4. Message Router (depends on all managers) -->
    <script src="{{messageRouterUri}}"></script>

    <!-- 5. Main dashboard orchestrator (wires everything together) -->
    <script src="{{scriptUri}}"></script>
  </body>
</html>
