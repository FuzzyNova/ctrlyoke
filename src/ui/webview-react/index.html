<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; img-src {{cspSource}} data:; script-src {{cspSource}} 'unsafe-inline';"
    />
    <title>ctrlyoke</title>

    <!-- VS Code Codicons (URL injected by extension at runtime) -->
    <link rel="stylesheet" href="{{codiconsUri}}" />

    <!-- ctrlyoke Custom Icons (URL injected by extension at runtime) -->
    <link rel="stylesheet" href="{{customIconsUri}}" />

    <!-- Typo.js for spell checking (no npm alternative) -->
    <!-- Note: Path will be replaced with webview URI by CtrlYokeWebviewProvider -->
    <script src="{{typoUri}}"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
