$schema: http://json-schema.org/draft-07/schema#
title: FlightPath Prompt Schema
type: object
description: >-
  Schema for FlightPath prompts. Prompts should be in final-form format with all context variables
  (e.g., @workspace, #file:path, #selection) and slash commands (e.g., /fix, /explain) included
  directly in the prompt text.
oneOf:
  - title: Single Prompt
    $ref: '#/definitions/promptItem'
  - title: Multiple Prompts (or Working File)
    properties:
      prompts:
        type: array
        items:
          $ref: '#/definitions/promptItem'
      originalFile:
        type: string
        description: Path to original prompt file (working files only)
      workflowName:
        type: string
        description: Derived workflow name (working files only)
      startedAt:
        type: number
        description: Timestamp when workflow started (working files only)
      _runtime:
        $ref: '#/definitions/runtimeMetadata'
    required:
      - prompts
    additionalProperties: false
definitions:
  promptItem:
    type: object
    properties:
      id:
        type: string
        description: >-
          Optional unique identifier for this prompt. Used for tracking completion across queue
          reloads. If omitted, a content hash is used automatically.
        pattern: ^[a-zA-Z0-9-_]+$
        maxLength: 50
      prompt:
        type: string
        description: >-
          The prompt to send to GitHub Copilot. Can be either: (1) Final-form prompt text with
          context variables (@workspace, #file:path:line-line, etc.) and slash commands (/fix,
          /explain, etc.) directly in the text, OR (2) A file path to a .prompt.md, .md, or .txt
          file containing the prompt. File paths are resolved relative to the prompt file's
          directory, then workspace root, then .flightpath directory. Absolute paths are also
          supported.
      provider:
        type: string
        description: >-
          AI provider to use for this prompt. Determines which CLI or chat integration to use.
          Optional - defaults to flightpath.provider setting.
        enum:
          - copilot-cli
          - copilot-chat
          - claude-cli
          - codex-cli
      model:
        type: string
        description: >-
          AI model to use for this prompt. Available models are queried dynamically from your
          Copilot subscription. Use IntelliSense (Ctrl+Space) to see available models. CLI mode
          supports limited models (claude-sonnet-4.5, claude-sonnet-4, claude-haiku-4.5, gpt-5) -
          others will fallback to default with warning. Optional - defaults to
          flightpath.copilotCliModel setting.
        examples:
          - auto
          - claude-haiku-4.5
          - claude-opus-4.5
          - claude-sonnet-4
          - claude-sonnet-4.5
          - copilot-fast
          - gemini-2.5-pro
          - gemini-3-flash-preview
          - gemini-3-pro-preview
          - gpt-4.1
          - gpt-4o
          - gpt-4o-mini
          - gpt-5
          - gpt-5-codex
          - gpt-5-mini
          - gpt-5.1
          - gpt-5.1-codex
          - gpt-5.1-codex-max
          - gpt-5.1-codex-mini
          - gpt-5.2
          - gpt-5.2-codex
          - grok-code-fast-1
          - haiku
          - opus
          - oswe-vscode-prime
          - sonnet
          - sonnet[1m]
      agent:
        type: string
        description: >-
          Custom agent to use for this prompt (CLI mode only). Specify ONLY the agent name without
          file extensions (e.g., 'flightpath-orchestrator' for file
          'flightpath-orchestrator.agent.md'). The '.agent' suffix is automatically added. Agents
          are discovered from .github/agents/ or ~/.copilot/agents/. Chat mode cannot
          programmatically select agents - users must manually select from dropdown. See
          docs/CHAT_MODE_LIMITATIONS.md for details.
        pattern: ^[a-zA-Z0-9-_]+$
      newChatSession:
        type: boolean
        description: >-
          Whether to start a new chat session for this prompt. When omitted, defaults to the
          flightpath.newChatSessionPerPrompt setting (default: true). Set to false to continue in
          the existing session for context continuity. Retries always use the same session
          regardless of this setting.
      allowDynamicExtension:
        type: boolean
        description: >-
          Enable dynamic queue extension for this prompt. When true: CLI modes (copilot-cli,
          claude-cli, codex-cli) pass MCP server configuration to enable flightpath_append_queue and
          flightpath_queue_status tools. Chat mode injects instructions to use these tools via
          Language Model Tools API. When false, no MCP config or instructions are provided. When
          omitted, defaults to true for last prompt only (when no other prompts have explicit
          flags).
      endCondition:
        $ref: '#/definitions/endCondition'
    required:
      - prompt
  endCondition:
    type: object
    properties:
      script:
        type: string
        description: >-
          Path to script file to execute, or direct shell command (e.g., 'npm test', 'python
          script.py'). File paths are resolved relative to workspace root or .flightpath directory.
      returns:
        type: string
        description: >-
          Expected output from script (stdout). Matching rules: (1) Exact match (case-insensitive),
          (2) Boolean: 'true' matches true/1/yes/pass/passed, 'false' matches
          false/0/no/fail/failed, (3) Numeric: compared as >= (e.g., '90' matches if script outputs
          90 or higher), (4) Substring: matches if output contains this string
      timeout:
        type: number
        description: Timeout in milliseconds
      maxRetries:
        type: number
        description: >-
          Maximum number of retry attempts when validation fails. Use -1 for unlimited retries (use
          with caution), 0 for no retries (default), or 1-100 for a specific limit.
        minimum: -1
        maximum: 100
      retryPrompt:
        type: string
        description: >-
          Template for retry prompt with placeholders: {scriptOutput}, {errorOutput},
          {expectedValue}, {actualValue}, {retryCount}, {maxRetries}
    required:
      - script
      - returns
  runtimeMetadata:
    type: object
    description: >-
      Runtime execution state for working files (optional, added automatically by FlightPath during
      execution)
    properties:
      currentIndex:
        type: number
        description: Index of currently executing prompt (0-based)
      completedPrompts:
        type: array
        items:
          type: string
        description: Array of completed prompt IDs and hashes
      executionState:
        type: string
        enum:
          - idle
          - running
          - paused
          - completed
          - cancelled
          - error
        description: Current execution state
    required:
      - currentIndex
      - completedPrompts
      - executionState
    additionalProperties: false
