name: Deploy Site Preview to Netlify

# Per-branch preview deploy (Netlify alias URL) for non-main branches that touch the
# site, docs, legal pages, license constants, or Netlify functions. Useful for previewing
# a major site change before merging to main.
on:
  push:
    branches-ignore: [main]
    paths:
      - "landing/**"
      - "docs/**"
      - "images/**"
      - "schemas/**"
      - "LICENSE.md"
      - "PRIVACY.md"
      - "DPA.md"
      - "ENTERPRISE_TERMS.md"
      - "TRUST_PAGE.md"
      - "src/license/**"
      - "netlify/**"
      - "README.md"
      - "scripts/merge-docs-into-landing.mjs"
      - "scripts/sync-docs-screenshots.mjs"
      - "scripts/publish-schemas-to-landing.mjs"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/_netlify-deploy.yml"

jobs:
  deploy-preview:
    uses: ./.github/workflows/_netlify-deploy.yml
    with:
      deploy-args: --alias=${{ github.ref_name }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
