name: CI

# The single test gate: everything `npm test` covers, plus the checks the
# local pre-push hook runs (`npm run check:fast`: typecheck, lint, format,
# packaging tests) and a production build with the npm tarball test against
# it. Every pull request must pass it, and release.yml calls it
# (`workflow_call`) against the tagged commit before publishing anything. The
# weekly schedule catches drift between PRs, such as a new VS Code release
# breaking the extension-host tests.
#
# Each suite runs on its own runner rather than through
# scripts/run-test-suites.mjs, because a hosted runner has only 4 vCPUs; the
# UI suite is further split into two shards. The extension-host job is the
# longest, at about 6.5 minutes. The PR checks were once split from a
# separate on-demand "full suite" because Actions minutes were metered and
# runners had 2 vCPUs while the repo was private; neither is true of the
# public repo.
#
# The `fast-checks` job is a required status check in the `main` ruleset
# (scripts/apply-github-guardrails.mjs). It only reports the other jobs'
# results, so the split jobs can change without touching the ruleset; it
# keeps its original name for that reason, though it now also waits on the
# extension-host tests. The workflow deliberately has no path filter -- a
# required check that never reports blocks the PR forever.
#
# Runs on `pull_request`, never `pull_request_target`: a fork PR gets a
# read-only token and no repo secrets, so code from the PR cannot reach them.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    - cron: "0 13 * * 1" # weekly, Monday 13:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and packaging tests
        run: npm run check:fast:no-ui

      # check:fast only makes a dev build without the webview, so the tarball
      # test skips there. Build what release.yml ships and test that instead.
      # build:extension strips dev commands from package.json; restore it.
      - name: Production build
        run: npm run build:prod && npm run restore-package

      - name: npm package installs and runs
        run: node --test scripts/build-npm-package.test.mjs

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: UI tests (shard ${{ matrix.shard }}/2)
        run: npm run test:ui -- --shard=${{ matrix.shard }}/2

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile:webview && npm run compile-tests

      # @vscode/test-electron launches VS Code, which needs a display.
      - name: Extension-host tests (xvfb-wrapped)
        run: xvfb-run -a npm run test:extension:run

  fast-checks:
    needs: [checks, ui, extension]
    # Always report, so a failed or cancelled dependency fails this check
    # instead of leaving it skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
