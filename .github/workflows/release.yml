name: Release

# Tag-driven publish. Pushing a vX.Y.Z tag (see CONTRIBUTING.md's "Cutting a
# release") packages the extension, verifies the tag matches
# package.json#version, publishes to the VS Code Marketplace, and creates a
# GitHub Release with the matching CHANGELOG.md section attached.
#
# Requires a VSCE_PAT repo secret (the Azure DevOps PAT with Marketplace
# "Manage" scope -- see RELEASE_CHECKLIST.md Phase 9) and a
# TELEMETRY_CONNECTION_STRING repo secret (the prod Application Insights
# connection string from the local .env).
#
# Also stages the `ctrlyoke` npm CLI package at the same version
# (dev/backlog/CLI_DISTRIBUTION_PLAN.md §3.2). That uses npm trusted publishing
# (GitHub OIDC), so there is no NPM_TOKEN. The trusted publisher only allows
# `npm stage publish`: the version goes live after a maintainer approves it on
# npmjs.com (Staged Packages tab) or with `npm stage approve <id>`, both of
# which require 2FA.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json#version
        run: node scripts/verify-release-tag.mjs

      - name: Resolve VSIX filename
        id: vsix
        run: echo "path=ctrlyoke-$(node -p "require('./package.json').version").vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npm run package
        env:
          # Compiled into the production bundle by esbuild.js; without it the
          # published VSIX ships with telemetry disabled.
          TELEMETRY_CONNECTION_STRING: ${{ secrets.TELEMETRY_CONNECTION_STRING }}

      - name: Build npm CLI package
        run: node scripts/build-npm-package.mjs

      - name: Test npm CLI package
        # Before anything is published: packs dist/npm from the production
        # build, installs the tarball, runs --version and validate.
        run: node --test scripts/build-npm-package.test.mjs

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "${{ steps.vsix.outputs.path }}" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        # v2 declares node20, which GitHub Actions no longer runs as of the September 2025
        # Node 20 deprecation -- it gets force-run on node24 and fails asset upload with
        # "Error creating asset temp dir". v3 declares node24 and doesn't hit this.
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: ctrlyoke-*.vsix

      - name: Stage npm CLI package
        # `npm stage` needs npm >= 11.15.0; Node 22 bundles npm 10. Provenance
        # is left to npm's default: it is generated automatically for a public
        # repo and is unsupported from a private one.
        working-directory: dist/npm
        run: |
          npm install -g npm@^11.15.0
          npm stage publish
