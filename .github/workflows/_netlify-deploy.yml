name: Netlify Deploy (Reusable)

on:
  workflow_call:
    inputs:
      deploy-args:
        description: "One extra flag passed to netlify deploy (e.g. --prod or --alias=branch-name)"
        required: true
        type: string
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Root install provides VitePress (a root devDep) for the docs build.
      # build:landing installs the landing project's own deps via `npm --prefix landing ci`.
      - name: Install root dependencies
        run: npm ci

      - name: Build landing site + docs
        run: npm run build:site

      # deploy-args carries a branch name for previews, and Git allows shell
      # metacharacters in those, so it reaches the shell only as a quoted env
      # var -- never spliced into the script with ${{ }}. Quoting also keeps it
      # one argument, which is why it must be a single flag.
      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --dir=landing/dist "$DEPLOY_ARGS"
        env:
          DEPLOY_ARGS: ${{ inputs.deploy-args }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
