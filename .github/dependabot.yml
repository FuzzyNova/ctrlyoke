# Dependabot version and security updates.
#
# Minor and patch bumps across every npm project arrive as one grouped PR per
# week (security fixes are grouped the same way, in their own PR). Major bumps
# are deliberately left out of the groups, so each one arrives as its own PR
# and can be reviewed and tested on its own.
#
# `cooldown` waits a few days after a release before proposing it, so a
# compromised or broken publish usually gets yanked before it reaches a PR.
# Security updates ignore the cooldown.
#
# CI's required `fast-checks` job gates every merge. `deploy-preview` fails on
# Dependabot PRs because they get no NETLIFY_AUTH_TOKEN; that check is not
# required.
version: 2

updates:
  - package-ecosystem: npm
    directories: ["/", "/landing", "/media"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    # Majors we have decided not to take yet. Each entry names what unblocks it
    # and links its backlog doc; delete the entry to get the PR back. Prefer this
    # over `@dependabot ignore`, which records the decision only inside Dependabot.
    ignore:
      # Blocked: @typescript-eslint 8.x peers typescript <6.1.0.
      # See dev/backlog/TYPESCRIPT_7_UPGRADE.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # A TypeScript major moves /, /landing and /media together in one PR.
      typescript-major:
        applies-to: version-updates
        patterns: [typescript]
        update-types: [major]
      security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
