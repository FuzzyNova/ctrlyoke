schemaVersion: 1
_templateMeta:
  name: bug-drain-loop
  description: Final-step-only loop that reviews the last round of bug fixes, then queues fixes for every bug in dev/bugs/backlog/ until the backlog is empty. Never files new bugs.
  variables:
    orchestratorHarness:
      type: harness
      default: claude-cli
      description: Harness that runs the orchestrator (the final step).
    orchestratorModel:
      type: text
      default: opus
      description: Orchestrator model, as named by the orchestrator harness.
    implementerHarness:
      type: harness
      default: codex-cli
      description: Harness that runs every queued bug-fix step.
    implementerModel:
      type: text
      default: gpt-6-luna
      description: Implementer model, as named by the implementer harness.

# Queued fix steps inherit these workflow defaults, so the implementer
# harness/model live here and the orchestrator overrides them on finalStep.
# Every queued step is a fresh, self-contained session.
resumeSession: false
priorContext: none
harness: "{implementerHarness}"
model: "{implementerModel}"
executionMode: headless
agent: null
skills:
  - commit

# No up-front steps: the first final-step pass finds an empty history, skips
# the review, and queues the backlog. The loop ends on the first pass that
# appends nothing.
steps: []

finalStep:
  name: drain-backlog
  harness: "{orchestratorHarness}"
  model: "{orchestratorModel}"
  executionMode: headless
  agent: spec-orchestrator
  mcpServers:
    - ctrlyoke
  # Each pass is a fresh session; the previous pass's output is attached so
  # it can see what was queued last time.
  resumeSession: false
  priorContext: finalStepPrevious
  prompt: |
    Your goal is to review the bug fixes from previous steps, then use append_step to
    queue fixes for the bugs currently in @dev/bugs/backlog/

    You run as this workflow's final step. Every pass is a new session, so you have no
    memory of earlier passes; the previous pass's output (if any) is attached above. Use
    workflow_status and read_output for more detail.

    ## 1. Review the last round of fixes

    Use workflow_status to find the steps that ran since the previous final-step pass. If
    there are none, skip to section 2. Steps named like "merge from main" are merges I
    added to bring in fixes made on main; don't review them as bug fixes, but do account
    for what they brought in.

    Review every bug fix that landed in that window (git log and the diffs). Confirm each
    one actually fixes its bug, didn't introduce a regression, has test coverage, and
    moved its bug doc to dev/bugs/implemented/ with a Resolution line. Fix the problems you
    find and commit them. If a follow-up is too big for this session, use append_step to
    queue it instead.

    ## 2. Queue the backlog

    Read every bug in @dev/bugs/backlog/ and the code it touches. Do not file new bugs —
    this workflow only drains the existing backlog. If you notice a new bug while
    reviewing, mention it in your summary instead.

    If a bug's description or recommended fix is clearly wrong, update the bug doc first.
    If a bug needs more thought than you can give it here, make finalizing it the first
    queued step.

    Then use append_step to add one step per chunk of work that can be completed in a
    single session, ordered so fixes don't duplicate or conflict with each other. Group
    small or related bugs into one step; split a really large fix into several. How you
    split the work is your call — that judgment is the point of this workflow. Every
    queued step must:
    - be self-contained (it runs in a fresh session with none of your reasoning)
    - name the bug doc(s) it fixes
    - add or update tests and pass `npm test`
    - git mv each bug it fixes to dev/bugs/implemented/ and replace its Severity line
      with "Resolution: fixed in this commit"
    - commit its own work before finishing

    If a bug needs my decision on the fix direction, skip it, queue the rest, and list it
    in your summary with the decision you need from me. If every remaining bug is blocked
    on me, queue nothing. If the backlog is empty and your review found nothing left to
    fix, queue nothing; that ends the workflow.

    End with a short summary: what you reviewed and fixed, what you queued, and anything
    that needs my input.

    Note: you are running headless, so you can't ask questions. Use your best judgment,
    and if you truly need my input, say so in your summary. When your turn ends your
    process stops and kills any subprocesses you started, so don't end your turn to wait
    on a task; block on long-running commands such as `npm test` instead. If you started
    the dev server to check a fix, stop it before you end your turn.
