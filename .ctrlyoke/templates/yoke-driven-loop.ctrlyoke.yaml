_templateMeta:
  name: yoke-driven-loop
  description: Orchestrator loop. Give it a spec/design doc — it breaks the work into steps, queues them, then reviews and keeps looping until every requirement is satisfied.
  variables:
    specFile:
      type: file
      fileFilter:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.yaml"
        - "**/*.json"
      autoFillFilename: true
resumeSession: false
priorContext: none
harness: codex-cli
model: gpt-5.6-luna
executionMode: headless
agent: null
skills:
  - commit
steps:
  - name: plan
    harness: claude-cli
    model: opus
    agent: spec-orchestrator
    mcpServers:
      - ctrlyoke
    prompt: |
      Be my ctrlyoke orchestrator for this specification:
      @{file:specFile}

      Review the spec and the codebase it touches, then use the ctrlyoke_append_queue
      tool to add one step for each chunk of work that can reasonably be completed in a
      single session, in the correct staging order. Update the spec first if you find a
      clear problem with it; if the plan needs more thought than you can give it here,
      make finalizing the plan the first queued step. Use your judgment on how to split
      the work — that judgment is the point of this workflow. Every queued step must be
      self-contained, must keep the planning docs current, and must commit its own work
      before finishing.

      Once you've queued the plan, end your turn. A review pass will run automatically
      after everything you queued has completed.
finalStep:
  name: review
  harness: claude-cli
  model: opus
  agent: spec-orchestrator
  mcpServers:
    - ctrlyoke
  resumeSession: true
  sessionId: 1
  prompt: |
    Resume your ctrlyoke orchestrator session for this specification:
    @{file:specFile}

    All the steps you queued should have run by now. Verify the work is actually
    complete, inspect it, fix any errors you find, and commit your cleanup. If a large
    chunk is still missing or wrong, use ctrlyoke_append_queue to append more steps and
    let the loop continue. Once everything is done, give me a real summary of what was
    built and end your turn. `npm test` should be the main gate, and generally follow
    @ctrlyoke/.github/instructions/test.instructions.md for testing.

    You don't need to work out whether this is your first review pass — you're
    resuming your planning session, so read the state and act accordingly.

    When the plan is complete, move the spec to the dev/implemented/ directory as part of your final commit.
